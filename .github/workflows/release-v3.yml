# V3 發布流程：推送 3.x.y 格式的 tag 時，建置單一 exe 並建立 GitHub Release。
#
# 自 3.0.2 起建立正式 Release：V1/V2 的自動更新讀取 releases/latest，
# 會抓到 V3 並自動升級（V3 首次啟動會從 V2 設定搬移快速配置）。
# 若某次想避免舊版升級，把 prerelease 改回 true 即可（該端點會略過 pre-release）。
name: Release V3

on:
  push:
    tags:
      - "3.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: >
          dotnet publish QuickIPChange.vbproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:Version=${{ github.ref_name }}
          -o publish

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          name: QuickIPChange V3 ${{ github.ref_name }}
          generate_release_notes: true
          files: publish/QuickIPChange.exe
